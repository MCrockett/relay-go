<script>
'use strict';
const address=new URL(location.href),token=address.searchParams.get('t');

const initial=new URLSearchParams(location.hash.slice(1));if(initial.has('repo')&&initial.has('slug'))selected={repo:initial.get('repo'),slug:initial.get('slug')};
const fmt=v=>v===null||v===undefined?'Unknown':Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
const date=v=>!v?'Unknown':new Date(typeof v==='number'?v*1000:v).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

const selKey=()=>selected?key(selected.repo,selected.slug):null;

function opener(row){return e=>{if(e.target.closest('button,a')||!row.repo_path)return;openFeature(row.repo_path,row.feature);};}
// One reserved message row: an action's result wins over the snapshot's state. Info clears itself; an error stays until

function notice(text,error=false,details=null){result={text,kind:error?'error':'ok',details,until:error?null:Date.now()+8000};say();if(!error)setTimeout(say,8100);}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Relay-Token':token||'','Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const result=await response.json();if(!response.ok){const e=new Error(result.error||'Request failed');e.status=response.status;e.fresh=result.fresh;throw e;}return result;}
function featureButton(row){const b=node('button',row.feature,'feature-name');if(row.repo_path)b.onclick=()=>openFeature(row.repo_path,row.feature);else b.disabled=true;return b;}
function prLink(info){if(!info?.url)return node('span',info?.number?'PR #'+info.number:'No PR','muted');const a=node('a','PR #'+info.number);a.href=info.url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function actions(row,only=null){const box=node('div',null,'actions');for(const action of (row.actions||[]).filter(a=>!only||only.has(a))){const b=node('button',labels[action],action==='merge'?'primary':'');if(action==='review'){b.onclick=()=>openReviewRequest(row);if(!(row.review_choices||[]).length){b.disabled=true;b.title='No reviewers configured: run relay roles set review.<author> "provider:model, ..."';}box.append(b);continue;}b.onclick=()=>{pending={action,repo:row.repo_path,slug:row.feature,seen:structuredClone(row.seen)};$('confirm-title').textContent=labels[action]+' for '+row.feature+'?';$('confirm-effect').textContent=effects[action];$('confirm-revision').textContent=row.seen.stage+' / '+row.seen.status+' · revision '+row.seen.commit.slice(0,8);$('confirm').showModal();};box.append(b);}return box;}
const running=row=>row.review_job?.state==='running'?'Review running: '+row.review_job.reviewer+' since '+date(row.review_job.started_at):null;
const healthText=row=>row.health?row.health.text:null,healthClass=row=>row.health?'health-'+row.health.kind:'';
// A finished job is announced once, by id, if it ended after this page loaded, whether or not the page saw it run.
let reviewTarget=null;const announced=new Set(),pageLoaded=Date.now()/1000;
function openReviewRequest(d){reviewTarget=d;const def=d.review_default||{},select=$('rr-reviewer');select.replaceChildren();if(!def.id)select.append(Object.assign(node('option','Choose a reviewer'),{value:''}));for(const c of d.review_choices||[]){const o=node('option',c.id+(c.id===def.id?' ('+def.label+')':'')+(c.available?'':' · out: '+c.reason));o.value=c.id;o.disabled=!c.available;select.append(o);}select.value=def.id&&(d.review_choices||[]).some(c=>c.id===def.id&&c.available)?def.id:'';$('rr-feature').textContent=d.feature+' / build';$('rr-note').textContent=def.note||'';$('rr-revision').textContent='revision '+d.seen.commit.slice(0,8);$('rr-go').disabled=!select.value;$('review-request').showModal();}
function renderRows(){const rows=data.rows||[],waiting=rows.filter(r=>r.waiting_on_owner),kind=r=>(r.actions||[]).includes('merge')?'ready':'decide';$('waiting-count').textContent=waiting.length;$('waiting-count').classList.toggle('attn',waiting.length>0);$('active-count').textContent=rows.filter(r=>r.stage!=='done').length;$('ready-count').textContent=rows.filter(r=>(r.actions||[]).includes('merge')).length;$('inbox-count').textContent=waiting.length;$('inbox-count').classList.toggle('attn',waiting.length>0);document.title=waiting.length?'('+waiting.length+') relay':'relay';
 for(const [k,a] of acted){const r=rows.find(x=>key(x.repo_path,x.feature)===k);if(!r||!r.waiting_on_owner||r.seen?.commit!==a.commit)acted.delete(k);}
 const inbox=$('inbox-list');inbox.replaceChildren();if(!waiting.length)inbox.append(node('div','You’re all caught up. Nothing is waiting on you.','empty'));
 for(const row of waiting){const k=key(row.repo_path,row.feature),done=acted.get(k),busy=running(row),card=node('article',null,'card '+kind(row)+(done?' acted':'')),title=node('div',null,'t');card.dataset.key=k;card.onclick=opener(row);title.append(node('div',row.repo||'Repository','eyebrow'),featureButton(row));const reason=node('p',null,'reason'),withHealth=()=>{if(healthText(row))reason.append(' · ',node('span',healthText(row),healthClass(row)));};if(busy){reason.append(busy);withHealth();}else if(done)reason.textContent=done.text+'. Updating the list…';else if(row.health_inbox)reason.append(node('span',healthText(row),healthClass(row)));else{reason.append(node('span',row.status,'st-'+kind(row)));const rest=[...row.flags,...(row.action_reasons?.merge?['Merge unavailable: '+row.action_reasons.merge]:[])];if(rest.length)reason.append(' · '+rest.join(' · '));withHealth();}const pr=node('div',null,'pr');if(row.pr)pr.append(prLink(row.pr_info));const buttons=actions(row,CARD_ACTIONS);if(!buttons.children.length&&(row.actions||[]).length&&row.repo_path){const open=node('button','Options');open.onclick=()=>openFeature(row.repo_path,row.feature);buttons.append(open);}if(done||busy)for(const b of buttons.querySelectorAll('button'))b.disabled=true;card.append(title,badge(row.stage),reason,pr,buttons);inbox.append(card);}
 const body=$('feature-rows');body.replaceChildren();for(const row of rows.filter(r=>$('show-done').checked||r.stage!=='done')){const tr=node('tr',null,row.waiting_on_owner?kind(row):''),first=node('td');if(row.repo_path){tr.dataset.key=key(row.repo_path,row.feature);tr.onclick=opener(row);}first.append(node('div',row.repo||'Repository','muted'),featureButton(row));tr.append(first);for(const k of ['stage','status','round','owner','verdict']){const parts=[row[k]??'-'];if(k==='status'){if(running(row))parts.push(running(row));if(row.health)parts.push(row.health.text);}tr.append(node('td',parts.join(' · '),['round','owner','verdict'].includes(k)?'minor':k==='status'&&row.health?healthClass(row):''));}tr.append(node('td',(row.flags||[]).join(' · '),'flags'));body.append(tr);}if(!body.children.length){const td=node('td','No features to show.');td.colSpan=7;body.append(node('tr'));body.firstChild.append(td);}markSelected();
 for(const row of rows){const j=row.review_job;if(j?.id&&j.state!=='running'&&!announced.has(j.id)){announced.add(j.id);if((j.ended_at||0)>=pageLoaded)notice(j.message,j.state==='failed');}}}
function meter(value,state='',tick=null){const bar=node('div',null,'meter '+state),fill=node('span');fill.style.width=Math.max(0,Math.min(100,value||0))+'%';bar.append(fill);let label=fmt(value)+' percent';if(tick!==null){const t=node('i',null,'tick');t.style.left=tick+'%';bar.append(t);label+=', '+fmt(tick)+' percent of the week gone';}bar.setAttribute('role','img');bar.setAttribute('aria-label',label);bar.title=label;return bar;}
function renderUsage(){$('session-hints').replaceChildren(...Object.entries(data.session_hints||{}).filter(([,t])=>t).map(([p,t])=>node('p',(p==='codex'?'Codex':'Claude')+': '+t)));const box=$('provider-meters'),strip=$('usage-strip');box.replaceChildren();strip.replaceChildren();for(const provider of ['codex','claude']){const value=data.usage?.providers?.[provider]||{},weekly=value.weekly,budget=value.budget||{},card=node('article',null,'panel'),head=node('div',null,'row');head.append(node('h3',provider==='codex'?'Codex':'Claude'),badge(value.blocked?'Out of usage':'Available',value.blocked?'warn':''));const gone=weekElapsed(weekly?.resets_at);card.append(head,node('div',weekly?fmt(weekly.used_pct)+'% of weekly limit':'Usage not available','usage-value'),meter(weekly?.used_pct,pace(value),gone),node('small',(gone!==null?fmt(gone)+'% of the week gone · ':'')+'Resets '+date(weekly?.resets_at)+' · Sample '+date(weekly?.sampled_at)));if(value.reason)card.append(node('p',value.reason,'reason'));const daily=node('div',null,'budget');daily.append(node('div','Today’s budget','eyebrow'));const text=budget.state==='no-baseline'?'No baseline yet':budget.state==='stale'?'Stale sample':budget.state==='over'?'Over plan by '+fmt(-budget.allowance)+' points':fmt(budget.meter)+'% of today’s allowance';daily.append(node('h3',text),meter(budget.meter,budget.state));daily.append(node('small',budget.allowance!==undefined?fmt(budget.used_today)+' points used / '+fmt(budget.allowance)+' available':'Needs a sample from before today in this week.'));card.append(daily);box.append(card);const item=node('span',null,pace(value)),name=node('span',provider==='codex'?'Codex':'Claude');item.append(name,meter(weekly?.used_pct,pace(value),gone),node('b',weekly?fmt(weekly.used_pct)+'%':'?'));if(weekly?.resets_at)item.append(node('span','resets '+date(weekly.resets_at)));strip.append(item);}renderLedger();}
const ledgerSort={repos:{key:'name',dir:'ascending'},models:{key:'name',dir:'ascending'}};function sortLedger(rows,key,dir){const sign=dir==='ascending'?1:-1;return [...rows].sort((a,b)=>{const x=a[key],y=b[key],c=typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true,sensitivity:'base'});return c*sign||String(a.name).localeCompare(String(b.name));});}function nextSort(sort,key){return sort.key===key?{key,dir:sort.dir==='ascending'?'descending':'ascending'}:{key,dir:key==='name'?'ascending':'descending'};}let ledgerShown='';function renderLedger(){const box=$('ledger-tables'),totals=data.usage?.ledger?.[$('ledger-period').value]||{},shown=JSON.stringify([totals,ledgerSort]);if(shown===ledgerShown&&box.children.length)return;ledgerShown=shown;const f=document.activeElement,keep=f?.dataset?.sortKind&&[f.dataset.sortKind,f.dataset.sortKey];box.replaceChildren();const cols=[['name',null],['runs','Runs'],['input','Input tokens'],['cached_share','Cached share'],['output','Output tokens'],['minutes','Minutes']];for(const [kind,title] of [['repos','By project'],['models','By model']]){box.append(node('h3',title));const wrap=node('div',null,'table-wrap'),table=node('table'),thead=node('thead'),head=node('tr'),sort=ledgerSort[kind];for(const [key,label] of cols){const th=node('th'),on=sort.key===key,b=node('button',label||(kind==='repos'?'Project':'Model'),'sort');b.dataset.sortKind=kind;b.dataset.sortKey=key;if(on){const arrow=node('span',sort.dir==='ascending'?' ▲':' ▼');arrow.setAttribute('aria-hidden','true');b.append(arrow);}th.setAttribute('aria-sort',on?sort.dir:'none');b.onclick=()=>{ledgerSort[kind]=nextSort(sort,key);renderLedger();};th.append(b);head.append(th);}thead.append(head);table.append(thead);const body=node('tbody');for(const total of sortLedger(totals[kind]||[],sort.key,sort.dir)){const tr=node('tr');for(const value of [total.name,fmt(total.runs),fmt(total.input),fmt(total.cached_share)+'%',fmt(total.output),fmt(total.minutes)])tr.append(node('td',value));body.append(tr);}if(!body.children.length){const tr=node('tr'),td=node('td','No reviewer runs in this period.');td.colSpan=6;tr.append(td);body.append(tr);}table.append(body);wrap.append(table);box.append(wrap);}if(keep)box.querySelector(`button[data-sort-kind="${keep[0]}"][data-sort-key="${keep[1]}"]`)?.focus({preventScroll:true});}
async function openFeature(repo,slug){selected={repo,slug};history.replaceState(null,'','#'+new URLSearchParams(selected));showView('projects');markSelected();await renderDetail();if(!wide.matches)$('detail').scrollIntoView({behavior:'smooth',block:'start'});}
function closeDetail(){selected=null;$('detail').hidden=true;$('projects-view').classList.remove('open');markSelected();history.replaceState(null,'',location.pathname);}
function showView(view){const usage=view==='usage';$('projects-view').hidden=usage;$('usage-view').hidden=!usage;$('tab-projects').classList.toggle('active',!usage);$('tab-usage').classList.toggle('active',usage);}
async function openReview(d,r){try{const response=await fetch('/api/file?'+new URLSearchParams({repo:d.repo_path,slug:d.feature,ref:d.seen.commit,path:r.path}),{headers:{'X-Relay-Token':token||''}});if(!response.ok){const e=await response.json();throw new Error(e.error);}$('review-title').textContent=r.path.split('/').pop();$('review-text').textContent=await response.text();$('review-dialog').showModal();}catch(e){notice(e.message,true);}}
async function renderDetail(){if(!selected)return;const selection=selected;try{const d=await api('/api/feature?'+new URLSearchParams(selection));if(selected!==selection)return;$('detail').hidden=false;$('projects-view').classList.add('open');$('detail-title').textContent=d.state.repo+' / '+d.feature;const box=$('detail-content');box.replaceChildren();const overview=node('div',null,'panel'),line=node('div',null,'row');const detailActions=actions(d);if(acted.has(key(d.repo_path,d.feature)))for(const b of detailActions.querySelectorAll('button'))b.disabled=true;line.append(badge(d.state.status),detailActions);overview.append(line);const timeline=node('div',null,'timeline');for(const stage of d.timeline){const item=node('div',null,stage.stage===d.state.stage?'current':'');item.append(node('strong',stage.stage),node('small',stage.skipped?'Skipped':stage.author||'No author'),node('small',stage.rounds+' rounds · '+(stage.verdict||'-')));timeline.append(item);}overview.append(timeline,node('p','Session: '+(d.owner_session?.provider||'Unknown')+' / '+(d.owner_session?.session||'Unknown')+(d.health?' · '+d.health.text:'')+(d.unpushed>0?' · '+d.unpushed+' unpushed':'')+(d.origin_at?' · newest commit on origin '+date(d.origin_at):''),'session '+(d.health?'health-'+d.health.kind:'')),node('p','CI for code: '+d.ci),prLink(d.pr_info));if(running(d))overview.append(node('p',running(d),'reason'));else if(d.review_job)overview.append(node('p','Last requested review ('+d.review_job.reviewer+'): '+d.review_job.message,'reason'+(d.review_job.state==='failed'?' st-decide':'')));if(d.local_changes)overview.append(node('p','Local changes not published','reason'));for(const [a,r] of Object.entries(d.action_reasons||{}))overview.append(node('p',labels[a]+' unavailable: '+r,'reason'));box.append(overview);
 for(const [key,title] of [['handoff','Published handoff'],['local_handoff','Local handoff (not pushed)']])if(d[key]){const panel=node('div',null,'panel');panel.append(node('h3',title),node('pre',d[key].text));box.append(panel);}
 const reviews=node('div',null,'panel');reviews.append(node('h3','Reviews'));if(!d.reviews.length)reviews.append(node('p','No reviews yet.','reason'));for(const r of d.reviews){const item=node('article',null,'review'),head=node('div',null,'row'),name=node('div');name.append(node('strong',r.stage+' / round '+(r.round??'?')+' · '+(r.verdict||'Notes')),node('p',[r.reviewer,r.model,r.effort].filter(Boolean).join(' · '),'reason'));const link=node('button','Open review');link.onclick=()=>openReview(d,r);head.append(name,link);item.append(head);for(const flag of ['fallback','same_provider','confirmation'])if(r[flag])item.append(badge(flag.replace('_',' '),'warn'));for(const [key,label] of [['blocking','Blocking findings'],['notes','Notes']])if(r[key]?.length){item.append(node('p',label,'reason'));const list=node('ul');for(const f of r[key])list.append(node('li',typeof f==='string'?f:f.id+': '+f.text));item.append(list);}if(r.parse_error)item.append(node('p',r.parse_error,'reason'));reviews.append(item);}box.append(reviews);
 const decisions=node('div',null,'panel');decisions.append(node('h3','Owner decisions'));if(!d.owner_actions.length)decisions.append(node('p','No owner decisions recorded.','reason'));for(const a of d.owner_actions)decisions.append(node('p',date(a.at)+' · '+a.action+(a.relayed_by?' · relayed by '+a.relayed_by:''),'reason'));box.append(decisions);
 }catch(e){notice(e.message,true);}}
async function load(){if(reading)return;reading=true;try{const cached=await api('/api/snapshot');snapshotNote=cached.loading?{text:'Loading your projects…'}:cached.error?{kind:'error',text:cached.error+(cached.data?' · Showing the last good snapshot, '+Math.floor(cached.age_seconds)+' seconds old.':' · The first snapshot could not be built.')}:cached.data&&cached.age_seconds>=60?{text:'Snapshot is '+Math.floor(cached.age_seconds)+' seconds old.'}:(cached.data?.notes||[]).length?{text:cached.data.notes.join(' · ')}:null;say();if(cached.data){data=cached.data;renderRows();renderUsage();await renderDetail();$('updated').textContent='Updated '+date(cached.built_at);}else $('updated').textContent=cached.loading?'Loading':'Needs attention';}catch(e){snapshotNote={kind:'error',text:e.message+' · Check that relay ui is still running.'};say();}finally{reading=false;}}
$('refresh').onclick=async()=>{try{await api('/api/refresh',{});notice('Refresh requested.');setTimeout(load,800);}catch(e){notice(e.message,true);}};
$('show-done').onchange=()=>data&&renderRows();$('ledger-period').onchange=()=>data&&renderLedger();$('close-detail').onclick=closeDetail;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected&&!document.querySelector('dialog[open]'))closeDetail();});
$('tab-usage').onclick=e=>{e.preventDefault();history.replaceState(null,'','#view=usage');showView('usage');};$('tab-projects').onclick=e=>{e.preventDefault();history.replaceState(null,'',selected?'#'+new URLSearchParams(selected):location.pathname);showView('projects');};showView(initial.get('view')==='usage'?'usage':'projects');$('close-review').onclick=()=>$('review-dialog').close();$('cancel-action').onclick=()=>$('confirm').close();
$('rr-reviewer').onchange=()=>{$('rr-go').disabled=!$('rr-reviewer').value;};$('rr-cancel').onclick=()=>$('review-request').close();
$('rr-go').onclick=async()=>{const d=reviewTarget,body={action:'review',repo:d.repo_path,slug:d.feature,seen:structuredClone(d.seen),reviewer:$('rr-reviewer').value};$('review-request').close();try{const r=await api('/api/action',body);notice(r.message);}catch(e){notice(e.status===409?'Changed since you looked: '+e.message:e.message,true,e.fresh);}finally{await load();}};
$('do-action').onclick=async()=>{const action=pending;$('confirm').close();try{notice(labels[action.action]+' is running for '+action.slug+'...');const result=await api('/api/action',action);acted.set(key(action.repo,action.slug),{text:past[action.action],commit:action.seen.commit});if(data)renderRows();notice(result.message);}catch(e){notice(e.status===409?'Changed since you looked: '+e.message:e.message,true,e.fresh);}finally{await load();setTimeout(load,1200);}};
